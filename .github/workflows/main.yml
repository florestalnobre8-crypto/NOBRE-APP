name: NOBRE - Gerar APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Gerar APK
        run: gradle assembleDebug

      - name: Preparar APK NOBRE
        run: |
          mkdir -p apk
          cp app/build/outputs/apk/debug/app-debug.apk apk/NOBRE.apk

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: NOBRE-APK
          path: apk/NOBRE.apk
